name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use public npm registry
        run: echo 'registry=https://registry.npmjs.org/' > .npmrc

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
