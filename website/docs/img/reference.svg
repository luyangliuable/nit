<text x="64" y="268" fill="#e7eaef" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET  POST          /api/sessions/:id/git</text>
<text x="64" y="300" fill="#e7eaef" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET                /api/sessions/:id/visualization</text>
<text x="64" y="332" fill="#e7eaef" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET                /api/models</text>
